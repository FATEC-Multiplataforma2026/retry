spring:
  application:
    name: demo
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

pokemon:
  rabbitmq:
    queue: pokemon.queue
    exchange: pokemon.exchange
    dead-letter: pokemon.dead-letter
    parking-lot: pokemon.parking-lot
    retry:
      max-retries: 3
      delay: 10s

pokeapi:
  url: https://pokeapi.co/api/v2

resilience4j:
  retry:
    instances:
      pokeapi:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - feign.FeignException$NotFound

logging:
  level:
    com.example.demo.pokemon.PokeApiClient: DEBUG

spring.cloud.openfeign.client.config.pokeapi:
  logger-level: basic
